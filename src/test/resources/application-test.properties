# ==========================================
# H2 In-Memory Database Configuration (MySQL Mode)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# Hibernate & JPA Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Enable formatting or keep clean during tests
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Database Initialization Scripts (schema.sql / data.sql)
# ==========================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================
# Migration Tools Override (Disabled for Tests)
# ==========================================
spring.flyway.enabled=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
application.security.jwt.secret-key=defaultTestSecretKeyForTestingPurposesOnly123456789
JWT_SECRET_KEY=defaultTestSecretKeyForTestingPurposesOnly123456789