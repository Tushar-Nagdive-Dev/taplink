server:
  port: ${PORT:1005}

spring:
  datasource:
    # Fallback to local/H2 defaults if environment variables aren't injected yet,
    # preventing the container from throwing a BeanInstantiationException.
    url: ${PROD_DATABASE_URL:jdbc:h2:mem:prod_fallback;DB_CLOSE_DELAY=-1}
    username: ${PROD_DATABASE_USERNAME:sa}
    password: ${PROD_DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    # If using H2 as a fallback, you can toggle flyway dynamically.
    # Set to true if pointing to a real MySQL database.
    enabled: true
    locations: 'classpath:db/migration'
    baseline-on-migrate: true
    baseline-version: "0"

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:DefaultFallbackSecretKeyForProduction1234567890}
      expiration: ${JWT_EXPIRATION:86400000}