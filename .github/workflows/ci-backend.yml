name: Java Backend CI Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    types: [opened, synchronize, reopened]

jobs:
  build-and-verify:
    name: Gradle Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # 3. Set up Node.js (Required because Gradle's build script triggers Angular compilation)
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: views/taplink/package.json

      # 4. Install Angular frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: views/taplink
        run: npm ci

      # 5. Grant execution permissions to Gradle wrapper
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # 6. Run Gradle build and tests using H2 test profile
      - name: Build and Test with Gradle
        run: ./gradlew clean build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: test