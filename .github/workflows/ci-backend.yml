name: Java Backend CI Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    types: [opened, synchronize, reopened]

jobs:
  build-and-verify:
    name: Gradle Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # 3. Grant execution permissions to Gradle wrapper
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # 4. Run Gradle build and tests using H2 test profile
      - name: Build and Test with Gradle
        run: ./gradlew clean build
        env:
          # Only pass app secrets like JWT; database uses H2 test profile automatically
          JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          SPRING_PROFILES_ACTIVE: test