@if (isLoading) {
  <app-loader message="Syncing with database..."></app-loader>
}

<div class="w-full max-w-5xl mx-auto pb-24 fade-in-up mt-4 px-4 sm:px-0">

  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
    <div>
      <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Link Manager</h2>
      <p class="text-slate-500 text-sm mt-1">Organize, edit, and track all your destinations in one place.</p>
    </div>

    <button (click)="openAddModal()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-500/30 hover:-translate-y-0.5 shrink-0">
      <lucide-icon [img]="PlusIcon" class="w-5 h-5" strokeWidth="3"></lucide-icon>
      <span>Add New Link</span>
    </button>
  </div>

  <div *ngIf="!isLoading" class="bg-white/80 backdrop-blur-2xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white overflow-hidden">

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse whitespace-nowrap" cdkDropList (cdkDropListDropped)="drop($event)">

        <thead>
        <tr class="bg-slate-50/50 border-b border-slate-200/60 text-xs uppercase tracking-wider text-slate-500 font-bold">
          <th class="p-4 w-12 text-center"></th>
          <th class="p-4 min-w-[200px]">Link Title</th>
          <th class="p-4 min-w-[250px]">Destination URL</th>
          <th class="p-4 w-32">Status</th>
          <th class="p-4 w-48 text-right pr-6">Actions</th>
        </tr>
        </thead>

        <tbody class="divide-y divide-slate-100/80">

        <tr *ngIf="myLinks.length === 0">
          <td colspan="5" class="py-16 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200">
              <lucide-icon [img]="LinkIcon" class="w-8 h-8 text-slate-400"></lucide-icon>
            </div>
            <h3 class="text-lg font-bold text-slate-700">No links found</h3>
            <p class="text-slate-500 text-sm mt-1">Click "Add New Link" to start building your profile.</p>
          </td>
        </tr>

        <tr *ngFor="let link of myLinks" cdkDrag
            class="group hover:bg-white transition-colors duration-200 relative"
            [ngClass]="{'opacity-60 grayscale-[15%]': !link.isActive}">

          <td class="p-4 text-center">
            <div cdkDragHandle class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-blue-500 transition-colors inline-block p-1">
              <lucide-icon [img]="GripIcon" class="w-5 h-5"></lucide-icon>
            </div>
          </td>

          <td class="p-4">
            <input type="text" [(ngModel)]="link.title" (change)="onLinkEdited(link)" placeholder="Enter title..."
                   class="w-full font-bold text-slate-800 text-sm outline-none bg-transparent hover:bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 rounded-lg px-2 py-1.5 transition-all placeholder:font-normal placeholder:text-slate-300">
          </td>

          <td class="p-4">
            <div class="relative w-full flex items-center group/url">
              <lucide-icon [img]="ExternalIcon" class="w-3.5 h-3.5 text-slate-400 absolute left-2 pointer-events-none group-hover/url:text-blue-400 transition-colors"></lucide-icon>
              <input type="text" [(ngModel)]="link.url" (change)="onLinkEdited(link)" placeholder="https://..."
                     class="w-full text-sm text-slate-500 outline-none bg-transparent hover:bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 rounded-lg pl-7 pr-2 py-1.5 transition-all placeholder:text-slate-300">
            </div>
          </td>

          <td class="p-4">
            <label class="relative inline-flex items-center cursor-pointer scale-90 origin-left">
              <input type="checkbox" [(ngModel)]="link.isActive" (ngModelChange)="onLinkEdited(link)" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500 shadow-inner"></div>
            </label>
          </td>

          <td class="p-4 text-right pr-6 flex items-center justify-end gap-1">

            <button (click)="toggleFavorite(link)" class="p-2 rounded-lg transition-all" title="Favorite"
                    [ngClass]="link.isFavorite ? 'text-amber-400 hover:bg-amber-50' : 'text-slate-300 hover:text-amber-400 hover:bg-slate-50'">
              <lucide-icon [img]="StarIcon" class="w-4 h-4" [ngClass]="{'fill-amber-400': link.isFavorite}"></lucide-icon>
            </button>

            <button (click)="copyShortLink(link.shortCode)" class="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-all" title="Copy Short Link">
              <lucide-icon [img]="CopyIcon" class="w-4 h-4"></lucide-icon>
            </button>

            <div class="w-px h-5 bg-slate-200 mx-1"></div>

            <button (click)="deleteLink(link.id)" class="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" title="Delete">
              <lucide-icon [img]="TrashIcon" class="w-4 h-4"></lucide-icon>
            </button>

          </td>

          <div *cdkDragPreview class="bg-white shadow-xl border border-blue-500 rounded-lg p-3 flex items-center justify-between opacity-95">
            <span class="font-bold text-slate-800 text-sm">{{ link.title || 'Moving Row...' }}</span>
            <lucide-icon [img]="GripIcon" class="w-4 h-4 text-slate-300"></lucide-icon>
          </div>

        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<app-add-link-modal
  [isOpen]="isAddModalOpen"
  (close)="isAddModalOpen = false"
  (linkAdded)="onLinkAdded($event)">
</app-add-link-modal>
