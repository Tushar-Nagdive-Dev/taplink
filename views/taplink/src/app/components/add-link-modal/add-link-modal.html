<div class="bg-white/90 backdrop-blur-2xl rounded-3xl w-full max-w-md shadow-2xl border border-white overflow-hidden flex flex-col relative transform transition-all duration-300 animate-in zoom-in-95">

  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200/50">
    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
        <lucide-icon [img]="LinkIcon" class="w-4 h-4"></lucide-icon>
      </div>
      Add New Link
    </h3>
    <button (click)="resetAndClose()" [disabled]="isLoading" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-all">
      <lucide-icon [img]="CloseIcon" class="w-5 h-5"></lucide-icon>
    </button>
  </div>

  <div class="p-6 flex flex-col gap-5">

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Link Title</label>
      <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all">
        <lucide-icon [img]="TypeIcon" class="w-4 h-4 text-slate-400 mr-2.5"></lucide-icon>
        <input type="text" [(ngModel)]="newLink.title" placeholder="e.g. My Instagram"
               class="bg-transparent border-none outline-none w-full text-sm text-slate-700 placeholder:text-slate-400 font-medium">
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Destination URL</label>
      <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all">
        <lucide-icon [img]="LinkIcon" class="w-4 h-4 text-slate-400 mr-2.5"></lucide-icon>
        <input type="url" [(ngModel)]="newLink.url" placeholder="https://"
               class="bg-transparent border-none outline-none w-full text-sm text-slate-700 placeholder:text-slate-400 font-medium">
      </div>
    </div>

  </div>

  <div class="px-6 py-4 bg-slate-50/50 border-t border-slate-200/50 flex justify-end gap-3 rounded-b-3xl">
    <button (click)="resetAndClose()" class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-200/50 transition-all">
      Cancel
    </button>
    <button (click)="saveLink()" [disabled]="isLoading || !newLink.title || !newLink.url"
            class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
      <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      {{ isLoading ? 'Saving...' : 'Add Link' }}
    </button>
  </div>

</div>
