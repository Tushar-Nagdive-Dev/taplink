<div class="flex h-screen w-screen overflow-hidden bg-gradient-to-br from-slate-50 to-slate-200">

  <aside class="macos-glass z-[100] flex flex-row md:flex-col items-center md:items-stretch
                fixed md:relative bottom-0 left-0 md:bottom-auto w-full md:w-[260px]
                h-[70px] md:h-[calc(100vh-32px)] md:m-4 rounded-t-2xl md:rounded-3xl px-2 md:px-0 transition-all">

    <div class="hidden md:flex p-6 lg:px-8 items-center gap-3 text-slate-900 font-bold text-xl tracking-tight">
      <span class="text-2xl">🔗</span>
      <span>Taplink</span>
    </div>

    <nav class="flex md:flex-col flex-row flex-1 justify-around md:justify-start md:px-4 gap-1 md:gap-2 w-full md:overflow-y-auto">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="active-nav-item"
         class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-3 p-2 md:p-3 rounded-xl text-slate-500 font-medium hover:bg-black/5 hover:text-slate-900 transition-all w-full">

        <lucide-icon [img]="item.icon" class="w-5 h-5 md:w-[18px] md:h-[18px]" strokeWidth="2.5"></lucide-icon>
        <span class="text-[10px] md:text-[15px] tracking-wide">{{ item.label }}</span>
      </a>
    </nav>

    <div class="hidden md:block p-4">
      <button (click)="logout()" class="flex items-center gap-3 p-3 w-full rounded-xl text-red-500 font-medium hover:bg-red-50 transition-all">
        <lucide-icon [img]="LogOutIcon" class="w-5 h-5" strokeWidth="2.5"></lucide-icon>
        <span>Log Out</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-[calc(100vh-70px)] md:h-full overflow-hidden relative">

    <header class="h-[80px] flex items-center justify-between px-6 md:px-10 shrink-0">

      <div class="hidden md:flex flex-col">
        <h2 class="text-xl font-bold text-slate-800 tracking-tight">Dashboard</h2>
      </div>

      <div class="flex items-center gap-4 ml-auto">
        <button class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 text-white flex items-center justify-center font-bold shadow-lg shadow-blue-500/30 hover:scale-105 hover:shadow-blue-500/50 transition-all duration-300">
          U
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto px-4 md:px-10 pb-20 md:pb-10 fade-in-up">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
