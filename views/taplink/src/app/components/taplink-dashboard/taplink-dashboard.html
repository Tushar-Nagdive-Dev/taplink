<div class="flex h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-100 via-fuchsia-50 to-cyan-100">

  <aside class="macos-glass z-50 flex flex-col transition-all duration-300 ease-in-out my-4 ml-4 rounded-3xl"
         [ngClass]="isLeftExpanded ? 'w-[260px]' : 'w-[80px]'">

    <div class="h-20 flex items-center px-6 overflow-hidden shrink-0"
         [ngClass]="isLeftExpanded ? 'justify-start' : 'justify-center px-0'">
      <div class="flex items-center gap-3 text-slate-900 font-bold text-xl tracking-tight whitespace-nowrap">
        <span class="text-2xl">🔗</span>
        <span *ngIf="isLeftExpanded" class="fade-in-up">Taplink</span>
      </div>
    </div>

    <nav class="flex flex-col flex-1 gap-2 px-3 overflow-y-auto overflow-x-hidden mt-4">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="active-nav-item"
         class="flex items-center gap-3 p-3 rounded-xl text-slate-500 font-medium hover:bg-black/5 hover:text-slate-900 transition-all whitespace-nowrap"
         [ngClass]="!isLeftExpanded ? 'justify-center' : ''">

        <lucide-icon [img]="item.icon" class="w-5 h-5 shrink-0" strokeWidth="2.5"></lucide-icon>
        <span *ngIf="isLeftExpanded" class="tracking-wide">{{ item.label }}</span>
      </a>
    </nav>

    <div class="p-4 shrink-0">
      <button (click)="logout()"
              class="flex items-center gap-3 p-3 w-full rounded-xl text-red-500 font-medium hover:bg-red-50 transition-all whitespace-nowrap"
              [ngClass]="!isLeftExpanded ? 'justify-center' : ''">
        <lucide-icon [img]="LogOutIcon" class="w-5 h-5 shrink-0" strokeWidth="2.5"></lucide-icon>
        <span *ngIf="isLeftExpanded">Log Out</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden transition-all duration-300">

    <header class="macos-glass h-[72px] mx-4 mt-4 rounded-2xl px-4 flex items-center justify-between shrink-0 z-40">

      <div class="flex items-center gap-4">
        <button (click)="toggleLeftSidebar()" class="p-2 rounded-lg text-slate-500 hover:bg-black/5 transition-all">
          <lucide-icon [img]="PanelLeftIcon" class="w-5 h-5"></lucide-icon>
        </button>
        <h2 class="text-lg font-bold text-slate-800 tracking-tight hidden sm:block">Editor</h2>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">

        <button class="p-2 rounded-lg text-slate-500 hover:bg-black/5 transition-all relative hidden sm:block">
          <lucide-icon [img]="BellIcon" class="w-5 h-5"></lucide-icon>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
        </button>

        <div (click)="openProfileModal()"
          class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 text-white flex items-center justify-center font-bold shadow-lg shadow-blue-500/30 cursor-pointer hover:scale-105 transition-all">
          U
        </div>

        <div class="w-px h-6 bg-slate-200 mx-1"></div>

        <button (click)="toggleRightSidebar()" class="p-2 rounded-lg transition-all"
                [ngClass]="isRightExpanded ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-black/5'">
          <lucide-icon [img]="PanelRightIcon" class="w-5 h-5"></lucide-icon>
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 sm:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>

  <aside class="macos-glass z-50 flex flex-col transition-all duration-300 ease-in-out my-4 rounded-3xl overflow-hidden shrink-0"
         [ngClass]="isRightExpanded ? 'w-[320px] mr-4 opacity-100' : 'w-0 mr-0 opacity-0 border-none'">

    <div class="h-20 flex items-center px-6 shrink-0 border-b border-slate-100">
      <h3 class="font-bold text-slate-800">Configuration</h3>
    </div>

    <div class="flex-1 p-6 overflow-y-auto">
      <div class="flex flex-col gap-4">

        <div class="p-4 rounded-2xl bg-white/50 border border-slate-100">
          <div class="h-4 w-24 bg-slate-200 rounded animate-pulse mb-3"></div>
          <div class="h-10 w-full bg-slate-100 rounded-lg animate-pulse"></div>
        </div>

        <div class="p-4 rounded-2xl bg-white/50 border border-slate-100">
          <div class="h-4 w-32 bg-slate-200 rounded animate-pulse mb-3"></div>
          <div class="h-10 w-full bg-slate-100 rounded-lg animate-pulse"></div>
        </div>

      </div>
    </div>
  </aside>

</div>
<app-user-profile
  [isOpen]="isProfileModalOpen"
  (close)="closeProfileModal()"
></app-user-profile>
