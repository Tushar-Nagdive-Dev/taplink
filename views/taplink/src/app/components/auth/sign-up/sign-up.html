@if (isLoading) {
  <app-loader message="Creating your account..."></app-loader>
}
<div class="flex flex-col items-center w-full fade-in-up">

  <div class="text-center mb-8">
    <h2 class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Create Account</h2>
    <p class="text-sm text-slate-500">Start organizing your digital presence today.</p>
  </div>

  <form class="w-full flex flex-col gap-5 mb-6" [formGroup]="signUpForm" (ngSubmit)="onSubmit()">

    <div class="grid grid-cols-2 gap-4 w-full">
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">First Name</label>
        <input type="text" formControlName="firstName" class="macos-input" placeholder="John">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Last Name</label>
        <input type="text" formControlName="lastName" class="macos-input" placeholder="Appleseed">
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Username</label>
      <input type="text" formControlName="username" class="macos-input" placeholder="tap.link/you">
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Email</label>
      <input type="email" formControlName="email" class="macos-input" placeholder="hello@example.com">
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Password</label>
      <input type="password" formControlName="password" class="macos-input" placeholder="••••••••">
      <span class="text-[11px] text-slate-400 ml-1 mt-0.5">Must be at least 8 characters.</span>
    </div>

    <button type="submit" class="macos-btn primary mt-4" [disabled]="signUpForm.invalid">
      Create Account
    </button>
  </form>

  <div class="flex items-center gap-2 text-sm text-slate-500">
    <span>Already have an account?</span>
    <a routerLink="/signin" class="macos-link highlight">Sign In</a>
  </div>
</div>
