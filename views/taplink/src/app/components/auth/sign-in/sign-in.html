@if (isLoading) {
  <app-loader message="Signing you in..."></app-loader>
}
<div class="auth-view fade-in-up">
  <h2 class="view-title">Welcome Back</h2>
  <p class="view-subtitle">Sign in to manage your Taplink dashboard.</p>

  <div class="social-logins">
    <button type="button" class="macos-btn social" (click)="loginWithProvider('google')">
      <span class="icon">G</span> Continue with Google
    </button>
    <button type="button" class="macos-btn social" (click)="loginWithProvider('github')">
      <span class="icon">🐙</span> Continue with GitHub
    </button>
  </div>

  <div class="divider-container">
    <span class="line"></span>
    <span class="text">or continue with email</span>
    <span class="line"></span>
  </div>

  <form class="macos-form" [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <input type="email" formControlName="username" class="macos-input" placeholder="username">
    </div>

    <div class="input-group">
      <input type="password" formControlName="password" class="macos-input" placeholder="Password">
    </div>

    <button type="submit" class="macos-btn primary" [disabled]="signInForm.invalid">Sign In</button>
  </form>

  <div class="auth-footer">
    <a href="#" class="macos-link">Forgot password?</a>
    <span class="divider">|</span>
    <a routerLink="/signup" class="macos-link highlight">Create an account</a>
  </div>
</div>
