@if (isLoading) {
  <app-loader message="Signing you in..."></app-loader>
}
<div class="flex flex-col items-center w-full fade-in-up">

  <h2 class="text-2xl font-bold text-slate-900 mb-2 tracking-tight">Welcome Back</h2>
  <p class="text-sm text-slate-600 mb-6">Sign in to manage your Taplink dashboard.</p>

  <div class="w-full flex flex-col gap-3 mb-6">
    <button type="button" class="macos-btn social" (click)="loginWithProvider('google')">
      <span class="font-bold text-lg">G</span> Continue with Google
    </button>
    <button type="button" class="macos-btn social" (click)="loginWithProvider('github')">
      <span class="font-bold text-lg">🐙</span> Continue with GitHub
    </button>
  </div>

  <div class="w-full flex items-center mb-6">
    <span class="flex-1 h-px bg-black/10"></span>
    <span class="px-3 text-xs text-slate-500 uppercase tracking-wider font-medium">or continue with email</span>
    <span class="flex-1 h-px bg-black/10"></span>
  </div>

  <form class="w-full flex flex-col gap-4 mb-6" [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <div class="w-full">
      <input type="email" formControlName="username" class="macos-input" placeholder="username">
    </div>

    <div class="w-full">
      <input type="password" formControlName="password" class="macos-input" placeholder="Password">
    </div>

    <button type="submit" class="macos-btn primary mt-2" [disabled]="signInForm.invalid">Sign In</button>
  </form>

  <div class="flex items-center gap-2 text-sm text-slate-500">
    <a href="#" class="macos-link">Forgot password?</a>
    <span class="text-slate-300">|</span>
    <a routerLink="/signup" class="macos-link highlight">Create an account</a>
  </div>
</div>
